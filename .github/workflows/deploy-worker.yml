name: Provision private R2 and deploy family API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-worker.yml'
      - 'worker/**'
      - 'r2-cors-wrangler.json'
permissions:
  contents: read
concurrency:
  group: family-r2-workers
  cancel-in-progress: false
jobs:
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check required secret names (never print secret values)
        id: credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SUPA_SECRET: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: bash
        run: |
          cloudflare_ready=true
          worker_ready=true
          if [[ -z "$CF_TOKEN" ]]; then
            echo "::notice::GitHub Actions secret missing: CLOUDFLARE_API_TOKEN"
            cloudflare_ready=false
          fi
          if [[ -z "$CF_ACCOUNT_ID" ]]; then
            echo "::notice::GitHub Actions secret missing: CLOUDFLARE_ACCOUNT_ID"
            cloudflare_ready=false
          fi
          if [[ -z "$R2_KEY_ID" ]]; then
            echo "::notice::GitHub Actions secret missing: R2_ACCESS_KEY_ID"
            worker_ready=false
          fi
          if [[ -z "$R2_SECRET" ]]; then
            echo "::notice::GitHub Actions secret missing: R2_SECRET_ACCESS_KEY"
            worker_ready=false
          fi
          if [[ -n "$SUPA_SECRET" && "$SUPA_SECRET" != sb_secret_* && "$SUPA_SECRET" != eyJ* ]]; then
            echo "::error::SUPABASE_SECRET_KEY must contain Seoul Supabase Secret key (sb_secret_...), not a publishable key"
            exit 1
          fi
          if [[ -z "$SUPA_SECRET" ]]; then
            echo "::notice::GitHub Actions secret missing: SUPABASE_SECRET_KEY"
            worker_ready=false
          fi
          echo "cloudflare_ready=$cloudflare_ready" >> "$GITHUB_OUTPUT"
          if [[ "$cloudflare_ready" != true ]]; then worker_ready=false; fi
          echo "worker_ready=$worker_ready" >> "$GITHUB_OUTPUT"
          if [[ "$worker_ready" != true ]]; then
            echo '### Cloudflare setup is waiting for GitHub Actions secrets' >> "$GITHUB_STEP_SUMMARY"
            echo 'Only secret names were checked; values were never logged.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install and type-check
        if: steps.credentials.outputs.cloudflare_ready == 'true'
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm run worker:bundle
      - name: Create or reuse private R2 bucket and install CORS
        if: steps.credentials.outputs.cloudflare_ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if npx wrangler r2 bucket info family-media-private > /dev/null 2>&1; then
            echo 'Using existing private-family bucket name'
          else
            npx wrangler r2 bucket create family-media-private --location apac --storage-class Standard
          fi
          # Never let the bucket expose objects on a public r2.dev URL.
          npx wrangler r2 bucket dev-url disable family-media-private --force
          # Fail deployment when an existing bucket has any active public custom domain.
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/family-media-private/domains/custom" \
            | node -e 'let s=""; process.stdin.on("data",c=>s+=c).on("end",()=>{const j=JSON.parse(s);if(!j.success||!Array.isArray(j.result?.domains)){console.error("Cannot verify private bucket custom domains");process.exit(1)}if(j.result.domains.some(x=>x.enabled)){console.error("R2 custom public domain enabled: refusing deployment");process.exit(1)}console.log("No active R2 public custom domains")})'
          npx wrangler r2 bucket cors set family-media-private --file r2-cors-wrangler.json --force
          npx wrangler r2 bucket cors list family-media-private
      - name: Deploy Worker with secrets, verify health
        if: steps.credentials.outputs.worker_ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          secrets_file="$RUNNER_TEMP/family-worker-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          node -e 'require("fs").writeFileSync(process.argv[1], JSON.stringify({
            SUPABASE_URL: "https://ulwkigdzmubyhtqvyzwe.supabase.co",
            SUPABASE_SECRET_KEY: process.env.SUPABASE_SECRET_KEY,
            R2_ACCOUNT_ID: process.env.CLOUDFLARE_ACCOUNT_ID,
            R2_ACCESS_KEY_ID: process.env.R2_ACCESS_KEY_ID,
            R2_SECRET_ACCESS_KEY: process.env.R2_SECRET_ACCESS_KEY
          }))' "$secrets_file"
          npx wrangler deploy -c worker/wrangler.toml --secrets-file "$secrets_file" 2>&1 | tee "$RUNNER_TEMP/family-worker-deploy.log"
          api_url="$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/family-worker-deploy.log" | head -n1 || true)"
          if [[ -n "$api_url" ]]; then
            echo "### Worker deployed: $api_url" >> "$GITHUB_STEP_SUMMARY"
            echo "Set GitHub Actions variable VITE_API_BASE_URL to $api_url, then re-run Deploy family gallery." >> "$GITHUB_STEP_SUMMARY"
            curl --fail-with-body --retry 4 --retry-delay 2 --silent --show-error "$api_url/api/health"
          else
            echo "::notice::Worker deployed; locate its workers.dev URL in Cloudflare Workers dashboard"
          fi
