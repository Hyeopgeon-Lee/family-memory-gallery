name: Verify deployed family API
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/api-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-api-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check Worker health and unauthenticated access protection
        shell: bash
        env:
          API_URL: https://family-memory-gallery-api.k-bigdata-family.workers.dev
        run: |
          set -euo pipefail
          echo "Checking public API health endpoint"
          response="$(curl -fsS --retry 12 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 15 "$API_URL/api/health")"
          test "$response" = '{"status":"ok"}'
          echo "Checking non-authenticated calls are rejected"
          code="$(curl -sS --retry 5 --retry-all-errors --retry-delay 3 --max-time 15 -o /dev/null -w '%{http_code}' "$API_URL/api/albums")"
          test "$code" = "401"
          echo "Checking production CORS preflight"
          headers="$(curl -fsSi --retry 5 --retry-all-errors --retry-delay 3 --max-time 15 -X OPTIONS -H 'Origin: https://family.k-bigdata.kr' -H 'Access-Control-Request-Method: GET' "$API_URL/api/albums")"
          echo "$headers" | grep -iq '^access-control-allow-origin: https://family\.k-bigdata\.kr'
          echo "Health, unauthorized API protection, and CORS checks passed"
